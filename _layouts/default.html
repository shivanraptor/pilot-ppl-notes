<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="This is a website dedicated to organizing my pilot preparation notes for the Cathay Pacific Cadet Pilot Programme.">
    <title>{{ page.title | default: site.name | default: "Raptor's Pilot Preparation Notes" }}</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-08YQ14PPEV"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-08YQ14PPEV');
    </script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Roboto, sans-serif;
        line-height: 1.55;
        margin: 0;
        color: #111;
        background: #F9F6F0;
      }
      main {
        max-width: 900px;
        margin: 2rem auto;
        padding: 0 1rem 2rem;
      }
      img {
        max-width: 100%;
        height: auto;
      }
      table {
        border-collapse: collapse;
      }
      th, td {
        border: 1px solid #ddd;
        padding: 0.45rem 0.55rem;
        vertical-align: top;
      }
      code {
        background: #f6f8fa;
        padding: 0.1rem 0.25rem;
        border-radius: 4px;
      }
      mjx-container {
        overflow-x: auto;
        overflow-y: hidden;
        max-width: 100%;
      }
      .textarea_weather {
        width: 100%;
        height: 300px;
        font-size: 14px;
        font-family: monospace;
        border: 1px solid #ddd;
        border-radius: 1px;
      }
    </style>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [
            ["$", "$"],
            ["\\(", "\\)"],
          ],
          displayMath: [
            ["$$", "$$"],
            ["\\[", "\\]"],
          ],
          processEscapes: true,
        },
        options: {
          skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"],
        },
      };
    </script>
    <script
      id="MathJax-script"
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    ></script>
  </head>
  <body>
    <main>
      {{ content }}
      {% include footer.html %}
    </main>
  </body>
</html>
