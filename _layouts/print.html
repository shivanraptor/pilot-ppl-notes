<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | default: "Print worksheet" }}</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.45;
        margin: 0;
        color: #111;
        background: #fff;
      }
      main {
        max-width: 800px;
        margin: 1.5rem auto;
        padding: 0 1.25rem 2rem;
      }
      h1 { font-size: 1.35rem; margin-bottom: 0.25rem; }
      h2 { font-size: 1.1rem; margin-top: 1.5rem; page-break-after: avoid; }
      .no-print {
        background: #f0f4f8;
        border: 1px solid #c5d0dc;
        padding: 0.75rem 1rem;
        margin-bottom: 1.5rem;
        border-radius: 6px;
        font-size: 0.95rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 0.5rem 0 1rem;
        page-break-inside: avoid;
      }
      th, td {
        border: 1px solid #333;
        padding: 0.5rem 0.6rem;
        vertical-align: top;
        min-height: 2.5rem;
      }
      th { background: #eee; text-align: left; width: 22%; }
      .story-block { page-break-inside: avoid; margin-bottom: 1.25rem; }
      hr { border: none; border-top: 1px dashed #999; margin: 1.5rem 0; }
      @media print {
        .no-print { display: none; }
        main { margin: 0; max-width: none; }
        a[href]::after { content: none; }
      }
    </style>
  </head>
  <body>
    <main>
      {{ content }}
    </main>
  </body>
</html>
